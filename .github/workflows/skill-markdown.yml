name: Skill Markdown

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "plugins/*/skills/**"
      - "scripts/lint-markdown-wrap.mjs"
      - "package.json"
      - "package-lock.json"
      - "schemas/skill-frontmatter.schema.json"
      - ".github/workflows/skill-markdown.yml"
  pull_request:
    paths:
      - "**/*.md"
      - "plugins/*/skills/**"
      - "scripts/lint-markdown-wrap.mjs"
      - "package.json"
      - "package-lock.json"
      - "schemas/skill-frontmatter.schema.json"
      - ".github/workflows/skill-markdown.yml"

permissions:
  contents: read

jobs:
  lint:
    name: Validate skill frontmatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install lint dependencies
        run: npm ci --ignore-scripts

      - name: Lint skill Markdown
        run: npm run lint:skills

      - name: Check for hard-wrapped Markdown
        run: npm run lint:markdown
