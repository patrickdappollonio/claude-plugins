name: visual-docs

on:
  push:
    branches: [main]
    paths:
      - "plugins/visual-docs/**"
      - "extras/visual-docs/**"
      - "scripts/sync-visual-docs.mjs"
      - ".github/workflows/visual-docs.yml"
  pull_request:
    paths:
      - "plugins/visual-docs/**"
      - "extras/visual-docs/**"
      - "scripts/sync-visual-docs.mjs"
      - ".github/workflows/visual-docs.yml"

jobs:
  verify:
    name: Verify vendored assets & syntax
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extras/visual-docs/server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Per-skill copies match the canonical renderer
        working-directory: .
        run: node scripts/sync-visual-docs.mjs

      - name: Vendored assets match the SBOM manifest
        run: node scripts/update-vendor.mjs --verify

      - name: Manifest covers every vendored file (no strays)
        run: |
          node -e '
            const fs = require("fs");
            const manifest = JSON.parse(fs.readFileSync("assets/vendor/manifest.json", "utf8"));
            const listed = new Set(manifest.assets.map(a => a.file).concat(["manifest.json"]));
            const onDisk = fs.readdirSync("assets/vendor");
            const strays = onDisk.filter(f => !listed.has(f));
            if (strays.length) {
              console.error("Files in assets/vendor/ not listed in manifest.json:", strays);
              process.exit(1);
            }
            console.log(`All ${onDisk.length} files accounted for.`);
          '

      - name: JavaScript syntax check
        run: |
          node --check bin/visual-docs-server.js
          node --check lib/server.js
          node --check lib/export.js
          node --check assets/app.js
          node --check scripts/update-vendor.mjs

      - name: Smoke test the server
        run: |
          node bin/visual-docs-server.js examples --port 8123 &
          sleep 1
          curl -sf http://127.0.0.1:8123/api/docs | grep -q demo-plan.md
          curl -sf http://127.0.0.1:8123/assets/vendor/mermaid.min.js -o /dev/null
          curl -sf http://127.0.0.1:8123/ | grep -q '<div id="app">'
          echo "smoke test passed"

      - name: Exported HTML carries no raw control or replacement characters
        run: |
          node bin/visual-docs-server.js --export examples demo-plan.md --out "$RUNNER_TEMP/demo-plan.html"
          node -e '
            const fs = require("fs");
            const vm = require("vm");
            const html = fs.readFileSync(process.argv[1], "utf8");
            const bad = html.match(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F-\u009F\uFFFD]/g) || [];
            if (bad.length) {
              const codes = [...new Set(bad.map(c => "U+" + c.charCodeAt(0).toString(16).toUpperCase().padStart(4, "0")))];
              console.error(`Export holds ${bad.length} raw character(s) that lib/export.js should have escaped: ${codes.join(", ")}`);
              process.exit(1);
            }
            let scripts = 0;
            for (const m of html.matchAll(/<script>([\s\S]*?)<\/script>/g)) { new vm.Script(m[1]); scripts++; }
            console.log(`Export is clean; ${scripts} inlined scripts still compile after escaping.`);
          ' "$RUNNER_TEMP/demo-plan.html"
